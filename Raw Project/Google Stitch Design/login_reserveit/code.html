<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ReserveIt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#004ac6",
                        "secondary-fixed": "#d9e3f4",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-container": "#bc4800",
                        "secondary": "#555f6d",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-fixed": "#dbe1ff",
                        "surface-tint": "#0053db",
                        "error": "#ba1a1a",
                        "surface": "#f8f9fa",
                        "on-secondary-fixed-variant": "#3e4755",
                        "on-background": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "on-secondary-fixed": "#121c28",
                        "outline": "#737686",
                        "tertiary-fixed-dim": "#ffb596",
                        "outline-variant": "#c3c6d7",
                        "secondary-container": "#d6e0f1",
                        "tertiary": "#943700",
                        "tertiary-fixed": "#ffdbcd",
                        "on-secondary-container": "#596372",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "background": "#f8f9fa",
                        "secondary-fixed-dim": "#bdc7d8",
                        "surface-container-low": "#f3f4f5",
                        "surface-dim": "#d9dadb",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e1e3e4",
                        "surface-container": "#edeeef",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary-container": "#eeefff",
                        "on-surface": "#191c1d",
                        "surface-container-highest": "#e1e3e4",
                        "primary-fixed-dim": "#b4c5ff",
                        "inverse-on-surface": "#f0f1f2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "base": "8px",
                        "md": "16px",
                        "container-margin": "32px",
                        "sm": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }],

                }
            }
        }

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-md md:p-xl">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
<div class="p-xl flex flex-col items-center">
<!-- Logo -->
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-on-primary text-3xl">meeting_room</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs text-center">ReserveIt</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-xl">Enterprise Admin Portal</p>
<form class="w-full flex flex-col gap-lg">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full h-10 px-md py-sm border border-outline-variant rounded-DEFAULT focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" id="email" placeholder="admin@enterprise.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-10 px-md py-sm border border-outline-variant rounded-DEFAULT focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-4 h-4 border-outline-variant rounded-sm text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full h-[44px] bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT hover:bg-primary/90 transition-colors flex items-center justify-center" type="submit">
                    Login
                </button>
</form>
</div>
<div class="bg-surface-container-low p-md border-t border-outline-variant flex justify-center">
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                Need an account? <a class="text-primary font-label-md text-label-md hover:underline" href="#">Contact IT Support</a>
</p>
</div>
</div>
</body></html>
